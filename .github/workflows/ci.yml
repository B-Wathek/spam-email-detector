name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run all tests (unit + data contract)
      run: PYTHONPATH=. pytest

    - name: Run evaluation gate (HW4)
      run: PYTHONPATH=. python pipelines/eval_pipeline.py
